<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MinimalAgent</title>
    <link rel="stylesheet" href="/ui/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/ui/css/base.css" />
    <link rel="stylesheet" href="/ui/css/layout.css" />
    <link rel="stylesheet" href="/ui/css/chat.css" />
    <link rel="stylesheet" href="/ui/css/markdown.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="session-panel" aria-label="Session settings">
        <div class="brand">
          <span class="brand-mark">M</span>
          <div>
            <h1>MinimalAgent</h1>
            <p>DeepAgent SSE Console</p>
          </div>
        </div>

        <label class="field">
          <span>User ID</span>
          <input id="userId" autocomplete="username" value="local-user" />
        </label>

        <input id="sessionUuid" type="hidden" autocomplete="off" />

        <section class="session-section" aria-label="Recent sessions">
          <div class="panel-heading">
            <h2>Sessions</h2>
            <span id="activeSessionLabel"></span>
          </div>
          <div id="sessionList" class="session-list"></div>
        </section>

        <button id="newSession" class="secondary-button" type="button">
          New session
        </button>

        <div class="status-block">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusText">Idle</span>
        </div>
      </aside>

      <section class="chat-panel" aria-label="Chat">
        <header class="chat-toolbar">
          <span>Chat</span>
          <button
            id="fileDrawerToggle"
            class="icon-button"
            type="button"
            aria-expanded="false"
            aria-controls="fileDrawer"
            title="Files"
          >
            Files
          </button>
        </header>
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <textarea
            id="messageInput"
            rows="3"
            placeholder="메시지를 입력하세요"
            required
          ></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>
      </section>

      <aside id="fileDrawer" class="file-drawer" aria-label="Workspace files" aria-hidden="true">
        <div class="drawer-header">
          <div>
            <h2>Files</h2>
            <p id="fileDrawerStatus">Ready</p>
          </div>
          <button id="fileDrawerClose" class="icon-button" type="button" title="Close">
            Close
          </button>
        </div>

        <form id="fileUploadForm" class="upload-form">
          <input id="fileInput" type="file" multiple />
          <button type="submit">Upload</button>
        </form>

        <button id="fileRefresh" class="secondary-button" type="button">
          Refresh
        </button>

        <ul id="fileList" class="file-list"></ul>
      </aside>
    </main>

    <script src="/ui/vendor/markdown-it/markdown-it.min.js"></script>
    <script src="/ui/vendor/dompurify/purify.min.js"></script>
    <script src="/ui/vendor/katex/katex.min.js"></script>
    <script type="module" src="/ui/scripts/app.mjs"></script>
  </body>
</html>
