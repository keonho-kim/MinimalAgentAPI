<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MinimalAgent</title>
    <link rel="stylesheet" href="/ui/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/ui/css/base.css" />
    <link rel="stylesheet" href="/ui/css/layout.css" />
    <link rel="stylesheet" href="/ui/css/chat.css" />
    <link rel="stylesheet" href="/ui/css/markdown.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="session-panel" aria-label="Session settings">
        <div class="brand">
          <span class="brand-mark">M</span>
          <div>
            <h1>MinimalAgent</h1>
            <p>DeepAgent SSE Console</p>
          </div>
        </div>

        <label class="field">
          <span>User ID</span>
          <input id="userId" autocomplete="username" value="local-user" />
        </label>

        <label class="field">
          <span>Session UUID</span>
          <input id="sessionUuid" autocomplete="off" />
        </label>

        <button id="newSession" class="secondary-button" type="button">
          New session
        </button>

        <div class="status-block">
          <span id="statusDot" class="status-dot idle"></span>
          <span id="statusText">Idle</span>
        </div>
      </aside>

      <section class="chat-panel" aria-label="Chat">
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <textarea
            id="messageInput"
            rows="3"
            placeholder="메시지를 입력하세요"
            required
          ></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/ui/vendor/markdown-it/markdown-it.min.js"></script>
    <script src="/ui/vendor/dompurify/purify.min.js"></script>
    <script src="/ui/vendor/katex/katex.min.js"></script>
    <script type="module" src="/ui/scripts/app.mjs"></script>
  </body>
</html>
