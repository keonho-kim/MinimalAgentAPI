[project]
name = "minial-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "keonho-kim", email = "keonhok0315@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.5.4",
    "fastapi>=0.136.1",
    "fastmcp>=3.2.4",
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.2",
    "langchain-community>=0.4.1",
    "langchain-google-genai>=4.2.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint>=4.0.3",
    "langgraph-checkpoint-postgres>=3.0.5",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "pymupdf>=1.27.2.3",
    "uvicorn>=0.46.0",
]

[project.scripts]
minial-agent = "minial_agent:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]
